<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Binary100Babies — NibBall</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: linear-gradient(145deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 16px;
  }
  .game {
    background: rgba(255,255,255,0.07);
    backdrop-filter: blur(12px);
    border-radius: 48px; padding: 32px 24px 40px;
    max-width: 560px; width: 100%;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    border: 1px solid rgba(255,255,255,0.1);
  }
  h1 {
    text-align: center; font-size: 28px; font-weight: 800;
    background: linear-gradient(135deg, #f7971e, #ffd200);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    letter-spacing: -0.5px; margin-bottom: 4px;
  }
  .tagline {
    text-align: center; color: rgba(255,255,255,0.4);
    font-size: 13px; letter-spacing: 2px; text-transform: uppercase;
    margin-bottom: 24px;
  }
  .score-row {
    display: flex; justify-content: space-between; align-items: center;
    background: rgba(0,0,0,0.3); border-radius: 20px; padding: 12px 20px;
    margin-bottom: 20px; border: 1px solid rgba(255,255,255,0.05);
  }
  .score-row span { color: rgba(255,255,255,0.5); font-size: 14px; font-weight: 600; }
  .score-row .val { color: #fff; font-size: 20px; font-weight: 800; }

  .bits { display: flex; justify-content: center; gap: 12px; margin-bottom: 24px; }
  .bit-btn {
    width: 80px; height: 100px; border-radius: 20px; border: 3px solid rgba(255,255,255,0.15);
    background: rgba(255,255,255,0.05); cursor: pointer; transition: all 0.15s ease;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 6px; position: relative; user-select: none; -webkit-tap-highlight-color: transparent;
  }
  .bit-btn:active { transform: scale(0.92); }
  .bit-btn .weight { font-size: 13px; font-weight: 700; color: rgba(255,255,255,0.3); }
  .bit-btn .lamp {
    width: 40px; height: 40px; border-radius: 50%;
    background: rgba(255,255,255,0.08); transition: all 0.2s ease;
    box-shadow: none;
  }
  .bit-btn.on { border-color: rgba(255,255,255,0.6); background: rgba(255,255,255,0.12); }
  .bit-btn.on .lamp {
    background: radial-gradient(circle at 35% 30%, #fff 0%, #ffd200 40%, #f7971e 100%);
    box-shadow: 0 0 24px rgba(255,210,0,0.5);
  }
  .bit-btn.on .weight { color: #ffd200; }
  .bit-btn.correct .lamp {
    background: radial-gradient(circle at 35% 30%, #fff 0%, #4ade80 40%, #16a34a 100%);
    box-shadow: 0 0 24px rgba(74,222,128,0.5);
  }
  .bit-btn.wrong .lamp {
    background: radial-gradient(circle at 35% 30%, #fff 0%, #f87171 40%, #dc2626 100%);
    box-shadow: 0 0 24px rgba(248,113,113,0.5);
  }

  .decimal-display {
    text-align: center; margin-bottom: 24px;
  }
  .decimal-display .label { color: rgba(255,255,255,0.35); font-size: 13px; text-transform: uppercase; letter-spacing: 1.5px; }
  .decimal-display .num {
    font-size: 64px; font-weight: 900; color: #fff;
    text-shadow: 0 0 40px rgba(255,255,255,0.15);
    line-height: 1;
  }
  .decimal-display .binary-str {
    font-size: 16px; color: rgba(255,255,255,0.35);
    font-family: 'Courier New', monospace; letter-spacing: 4px; margin-top: 2px;
  }

  .challenge-area {
    background: rgba(0,0,0,0.25); border-radius: 20px; padding: 16px;
    margin-bottom: 20px; text-align: center;
    border: 2px solid rgba(255,255,255,0.06);
    transition: border-color 0.3s;
  }
  .challenge-area.active { border-color: rgba(251,191,36,0.3); }
  .challenge-area .prompt { color: rgba(255,255,255,0.4); font-size: 13px; margin-bottom: 4px; }
  .challenge-area .target {
    font-size: 56px; font-weight: 900; color: #fbbf24;
    text-shadow: 0 0 30px rgba(251,191,36,0.2);
  }
  .challenge-area .hint {
    font-size: 14px; margin-top: 6px; font-weight: 600; transition: all 0.3s;
  }
  .challenge-area .hint.match { color: #4ade80; }
  .challenge-area .hint.nomatch { color: #f87171; }
  .challenge-area .hint.waiting { color: rgba(255,255,255,0.3); }

  .controls { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  .btn {
    padding: 12px 28px; border-radius: 16px; border: none; font-size: 16px;
    font-weight: 700; cursor: pointer; transition: all 0.15s ease;
    flex: 1; min-width: 120px;
  }
  .btn:active { transform: scale(0.95); }
  .btn-primary { background: linear-gradient(135deg, #f7971e, #ffd200); color: #1a1a2e; }
  .btn-primary:hover { box-shadow: 0 4px 20px rgba(255,210,0,0.3); }
  .btn-success { background: linear-gradient(135deg, #22c55e, #4ade80); color: #1a1a2e; }
  .btn-success:hover { box-shadow: 0 4px 20px rgba(74,222,128,0.3); }
  .btn-danger { background: linear-gradient(135deg, #ef4444, #f87171); color: #fff; }
  .btn-danger:hover { box-shadow: 0 4px 20px rgba(248,113,113,0.3); }
  .btn-outline {
    background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.6);
    border: 2px solid rgba(255,255,255,0.12);
  }
  .btn-outline:hover { background: rgba(255,255,255,0.12); color: #fff; }


  .modes { display: flex; gap: 8px; justify-content: center; margin-bottom: 16px; }
  .mode-btn {
    padding: 8px 18px; border-radius: 14px; font-size: 14px; font-weight: 700; cursor: pointer;
    background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.5);
    border: 2px solid rgba(255,255,255,0.1); transition: all 0.15s ease;
  }
  .mode-btn.active { background: rgba(255,210,0,0.15); color: #ffd200; border-color: rgba(255,210,0,0.5); }
  .arena-wrap { margin-bottom: 20px; }
  #arena {
    display: block; width: 100%; aspect-ratio: 480 / 560; border-radius: 24px;
    background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.08);
    touch-action: none; cursor: crosshair;
  }
  .arena-help { text-align: center; color: rgba(255,255,255,0.35); font-size: 13px; margin-top: 8px; }
  body.mode-bounce .bits { display: none; }
  body.mode-toggle .arena-wrap { display: none; }

  .celebration {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: rgba(0,0,0,0.6); backdrop-filter: blur(6px);
    z-index: 100; opacity: 0; pointer-events: none; transition: opacity 0.4s;
  }
  .celebration.show { opacity: 1; pointer-events: auto; }
  .celebration .box {
    background: linear-gradient(145deg, #1e293b, #0f172a);
    border-radius: 40px; padding: 40px; text-align: center;
    border: 2px solid rgba(251,191,36,0.3); max-width: 400px; width: 90%;
  }
  .celebration .box h2 { font-size: 48px; margin-bottom: 8px; }
  .celebration .box p { color: rgba(255,255,255,0.6); font-size: 18px; margin-bottom: 20px; }
  .celebration .box .big { font-size: 72px; margin-bottom: 8px; }

  .floaties { position: fixed; inset: 0; pointer-events: none; z-index: 101; overflow: hidden; }
  .floaty {
    position: absolute; font-size: 24px; animation: floatUp 1.5s ease-out forwards;
  }
  @keyframes floatUp {
    0% { opacity: 1; transform: translateY(0) scale(0.5); }
    100% { opacity: 0; transform: translateY(-200px) scale(1.2); }
  }

  @media (max-width: 500px) {
    .game { border-radius: 28px; padding: 20px 16px 28px; }
    .bits { gap: 8px; }
    .bit-btn { width: 64px; height: 84px; }
    .bit-btn .lamp { width: 32px; height: 32px; }
    .decimal-display .num { font-size: 48px; }
    .challenge-area .target { font-size: 42px; }
    .btn { font-size: 14px; padding: 10px 16px; min-width: 80px; }
  }
</style>
</head>
<body class="mode-bounce">

<div class="celebration" id="celebration">
  <div class="box">
    <div class="big">🎉</div>
    <h2>✨ Correct! ✨</h2>
    <p id="celebrationMsg">You got it!</p>
    <button class="btn btn-primary" onclick="closeCelebration(); nextChallenge();">Next!</button>
  </div>
</div>
<div class="floaties" id="floaties"></div>

<div class="game">
  <h1>Binary100Babies</h1>
  <p class="tagline">NibBall — A Whole Game in 4 Bits</p>

  <div class="score-row">
    <span>Score</span>
    <span class="val" id="scoreDisplay">0</span>
  </div>

  <div class="modes" role="group" aria-label="Game mode">
    <button class="mode-btn active" id="modeBounce" onclick="setMode('bounce')">🏀 Bounce</button>
    <button class="mode-btn" id="modeToggle" onclick="setMode('toggle')">💡 Easy toggle</button>
  </div>

  <div class="arena-wrap">
    <canvas id="arena" width="480" height="560" aria-label="NibBall arena: drop the ball into a box to flip that bit"></canvas>
    <div class="arena-help">Move to aim, tap or click to drop &middot; ← → and Space work too</div>
  </div>

  <div class="bits" role="group" aria-label="Binary bits">
    <button class="bit-btn" data-bit="3" onclick="toggleBit(3)">
      <div class="lamp"></div>
      <span class="weight">8</span>
    </button>
    <button class="bit-btn" data-bit="2" onclick="toggleBit(2)">
      <div class="lamp"></div>
      <span class="weight">4</span>
    </button>
    <button class="bit-btn" data-bit="1" onclick="toggleBit(1)">
      <div class="lamp"></div>
      <span class="weight">2</span>
    </button>
    <button class="bit-btn" data-bit="0" onclick="toggleBit(0)">
      <div class="lamp"></div>
      <span class="weight">1</span>
    </button>
  </div>

  <div class="decimal-display">
    <div class="label">You made</div>
    <div class="num" id="decimalNum">0</div>
    <div class="binary-str" id="binaryStr">0000</div>
  </div>

  <div class="challenge-area" id="challengeArea">
    <div class="prompt">🌟 Challenge — make this number:</div>
    <div class="target" id="targetNum">—</div>
    <div class="hint waiting" id="challengeHint">Set the bits to match!</div>
  </div>

  <div class="controls">
    <button class="btn btn-primary" onclick="startChallenge()">🌟 Challenge</button>
    <button class="btn btn-outline" onclick="resetBits()">↺ Reset</button>
  </div>
</div>

<script>
let bits = [0, 0, 0, 0];
let score = 0;
let challengeTarget = null;
let challengeDone = false;

const weights = [1, 2, 4, 8];

function getValue() {
  return bits.reduce((sum, b, i) => sum + b * weights[i], 0);
}

function updateDisplay() {
  const val = getValue();
  document.getElementById('decimalNum').textContent = val;
  document.getElementById('binaryStr').textContent = bits.slice().reverse().join('');

  const btns = document.querySelectorAll('.bit-btn');
  btns.forEach((btn, i) => {
    const isOn = bits[i] === 1;
    btn.classList.toggle('on', isOn);
    btn.classList.toggle('correct', false);
    btn.classList.toggle('wrong', false);
  });

  if (challengeTarget !== null && !challengeDone) {
    const hint = document.getElementById('challengeHint');
    if (val === challengeTarget) {
      hint.textContent = '✅ Perfect match!';
      hint.className = 'hint match';
      btns.forEach(b => { b.classList.add('correct'); b.classList.remove('on', 'wrong'); });
      challengeDone = true;
      score++;
      document.getElementById('scoreDisplay').textContent = score;
      setTimeout(showCelebration, 400);
    } else {
      const diff = val - challengeTarget;
      if (diff > 0) {
        hint.textContent = '⬇ Too high! Turn some bits off.';
      } else {
        hint.textContent = '⬆ Too low! Turn some bits on.';
      }
      hint.className = 'hint nomatch';
      btns.forEach(b => b.classList.remove('correct', 'wrong'));
    }
  }
}

function toggleBit(index) {
  if (challengeDone) return;
  bits[index] = bits[index] === 0 ? 1 : 0;
  updateDisplay();
}

function resetBits() {
  bits = [0, 0, 0, 0];
  challengeTarget = null;
  challengeDone = false;
  document.getElementById('challengeArea').classList.remove('active');
  document.getElementById('targetNum').textContent = '—';
  document.getElementById('challengeHint').textContent = 'Set the bits to match!';
  document.getElementById('challengeHint').className = 'hint waiting';
  updateDisplay();
}

function startChallenge() {
  resetBits();
  challengeTarget = Math.floor(Math.random() * 16);
  document.getElementById('challengeArea').classList.add('active');
  document.getElementById('targetNum').textContent = challengeTarget;
  document.getElementById('challengeHint').textContent = '⬆⬇ Set the bits!';
  document.getElementById('challengeHint').className = 'hint waiting';
  challengeDone = false;
  updateDisplay();
}

function nextChallenge() {
  startChallenge();
}

function showCelebration() {
  const el = document.getElementById('celebration');
  document.getElementById('celebrationMsg').textContent = challengeTarget + ' = ' + bits.slice().reverse().join('');
  el.classList.add('show');
  spawnFloaties();
}

function closeCelebration() {
  document.getElementById('celebration').classList.remove('show');
}

function spawnFloaties() {
  const container = document.getElementById('floaties');
  const emojis = ['⭐','🌟','✨','🎉','🎊','💡','🔢','✅','1','0'];
  for (let i = 0; i < 18; i++) {
    const el = document.createElement('div');
    el.className = 'floaty';
    el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
    el.style.left = (5 + Math.random() * 90) + '%';
    el.style.top = (60 + Math.random() * 40) + '%';
    el.style.animationDuration = (1 + Math.random()) + 's';
    container.appendChild(el);
    setTimeout(() => el.remove(), 2500);
  }
}

updateDisplay();

// ---------- Bounce mode ----------
const W = 480, H = 560;
const BIN_W = W / 4;
const BIN_TOP = H - 100;
const FLOOR_Y = H - 10;
const BALL_R = 11;
const GRAVITY = 1400, RESTITUTION = 0.55, MAX_SPEED = 1100;
const BIN_BIT = [3, 2, 1, 0]; // left-to-right bins are 8, 4, 2, 1

const canvas = document.getElementById('arena');
const ctx = canvas.getContext('2d');
const dpr = Math.min(window.devicePixelRatio || 1, 2);
canvas.width = W * dpr;
canvas.height = H * dpr;
ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

// Everything the ball bounces off is a capsule: a segment with a radius (pegs have a zero-length segment).
const caps = [];
[[80, 200], [240, 200], [400, 200], [160, 300], [320, 300], [80, 390], [240, 390], [400, 390]]
  .forEach(([x, y]) => caps.push({ ax: x, ay: y, bx: x, by: y, r: 7 }));
for (let i = 1; i < 4; i++) caps.push({ ax: i * BIN_W, ay: BIN_TOP, bx: i * BIN_W, by: FLOOR_Y, r: 4 });

let mode = 'bounce';
let aimX = W / 2;
let ball = null;        // null while aiming
let settled = null;     // { bin, t } flash after landing
let binFlash = [0, 0, 0, 0];
let stuckTime = 0;

function setMode(m) {
  mode = m;
  document.body.className = 'mode-' + m;
  document.getElementById('modeBounce').classList.toggle('active', m === 'bounce');
  document.getElementById('modeToggle').classList.toggle('active', m === 'toggle');
}

function dropBall() {
  if (ball || settled || challengeDone || mode !== 'bounce') return;
  ball = { x: aimX, y: 40, vx: 0, vy: 0, spin: 0 };
  stuckTime = 0;
}

function aimFromEvent(e) {
  const rect = canvas.getBoundingClientRect();
  aimX = Math.max(BALL_R + 6, Math.min(W - BALL_R - 6, (e.clientX - rect.left) * (W / rect.width)));
}
canvas.addEventListener('pointerdown', e => { aimFromEvent(e); });
canvas.addEventListener('pointermove', e => { if (!ball) aimFromEvent(e); });
canvas.addEventListener('pointerup', e => { aimFromEvent(e); dropBall(); });
window.addEventListener('keydown', e => {
  if (mode !== 'bounce') return;
  if (e.key === 'ArrowLeft') { aimX = Math.max(BALL_R + 6, aimX - 20); e.preventDefault(); }
  else if (e.key === 'ArrowRight') { aimX = Math.min(W - BALL_R - 6, aimX + 20); e.preventDefault(); }
  else if (e.key === ' ' || e.key === 'ArrowDown') { dropBall(); e.preventDefault(); }
});

function collide(b, c) {
  const dx = c.bx - c.ax, dy = c.by - c.ay;
  const len2 = dx * dx + dy * dy;
  let t = len2 ? ((b.x - c.ax) * dx + (b.y - c.ay) * dy) / len2 : 0;
  t = Math.max(0, Math.min(1, t));
  const px = c.ax + dx * t, py = c.ay + dy * t;
  let nx = b.x - px, ny = b.y - py;
  const d = Math.hypot(nx, ny), min = BALL_R + c.r;
  if (d >= min) return;
  if (d === 0) { nx = 0; ny = -1; } else { nx /= d; ny /= d; }
  b.x = px + nx * min;
  b.y = py + ny * min;
  const vn = b.vx * nx + b.vy * ny;
  if (vn < 0) {
    b.vx -= (1 + RESTITUTION) * vn * nx;
    b.vy -= (1 + RESTITUTION) * vn * ny;
    b.vx += (Math.random() - 0.5) * 20; // tiny wobble so the ball never balances on a peg
    b.spin = b.vx / 60;
  }
}

function stepBall(dt) {
  const b = ball;
  b.vy += GRAVITY * dt;
  const sp = Math.hypot(b.vx, b.vy);
  if (sp > MAX_SPEED) { b.vx *= MAX_SPEED / sp; b.vy *= MAX_SPEED / sp; }
  b.x += b.vx * dt;
  b.y += b.vy * dt;
  b.spin *= 0.99;
  if (b.x < BALL_R) { b.x = BALL_R; b.vx = Math.abs(b.vx) * RESTITUTION; }
  if (b.x > W - BALL_R) { b.x = W - BALL_R; b.vx = -Math.abs(b.vx) * RESTITUTION; }
  if (b.y > FLOOR_Y - BALL_R) { b.y = FLOOR_Y - BALL_R; b.vy = -Math.abs(b.vy) * RESTITUTION; b.vx *= 0.98; }
  for (const c of caps) collide(b, c);
  stuckTime = Math.hypot(b.vx, b.vy) < 15 ? stuckTime + dt : 0;
  if (stuckTime > 0.6) { b.vx += (Math.random() < 0.5 ? -1 : 1) * 120; b.vy -= 80; stuckTime = 0; }
  if (b.y > BIN_TOP + 35) landBall();
}

function landBall() {
  const bin = Math.max(0, Math.min(3, Math.floor(ball.x / BIN_W)));
  settled = { bin, x: ball.x, y: ball.y, t: 0 };
  binFlash[bin] = 1;
  ball = null;
  toggleBit(BIN_BIT[bin]);
}

let last = performance.now(), acc = 0;
function frame(now) {
  acc += Math.min(0.05, (now - last) / 1000);
  last = now;
  const dt = 1 / 120;
  while (acc >= dt) {
    if (ball) stepBall(dt);
    if (settled) { settled.t += dt; if (settled.t > 0.7) settled = null; }
    for (let i = 0; i < 4; i++) binFlash[i] = Math.max(0, binFlash[i] - dt * 2);
    acc -= dt;
  }
  draw(now / 1000);
  requestAnimationFrame(frame);
}

function drawBall(x, y, spin) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(spin);
  const g = ctx.createRadialGradient(-3, -4, 1, 0, 0, BALL_R);
  g.addColorStop(0, '#fff'); g.addColorStop(0.4, '#ffd200'); g.addColorStop(1, '#f7971e');
  ctx.shadowColor = 'rgba(255,210,0,0.6)'; ctx.shadowBlur = 14;
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(0, 0, BALL_R, 0, Math.PI * 2); ctx.fill();
  ctx.shadowBlur = 0;
  ctx.strokeStyle = 'rgba(26,26,46,0.45)'; ctx.lineWidth = 1.5; // four segments = four bits
  ctx.beginPath(); ctx.moveTo(-BALL_R, 0); ctx.lineTo(BALL_R, 0); ctx.moveTo(0, -BALL_R); ctx.lineTo(0, BALL_R); ctx.stroke();
  ctx.restore();
}

let ballSpin = 0;
function draw(time) {
  ctx.clearRect(0, 0, W, H);

  // bins
  for (let i = 0; i < 4; i++) {
    const on = bits[BIN_BIT[i]] === 1;
    const x = i * BIN_W, f = binFlash[i];
    const grad = ctx.createLinearGradient(0, BIN_TOP, 0, FLOOR_Y);
    grad.addColorStop(0, on ? 'rgba(255,210,0,0.10)' : 'rgba(255,255,255,0.02)');
    grad.addColorStop(1, on ? 'rgba(255,210,0,0.40)' : 'rgba(255,255,255,0.07)');
    ctx.fillStyle = grad;
    ctx.fillRect(x, BIN_TOP, BIN_W, FLOOR_Y - BIN_TOP);
    if (f > 0) { ctx.fillStyle = 'rgba(255,255,255,' + (f * 0.35) + ')'; ctx.fillRect(x, BIN_TOP, BIN_W, FLOOR_Y - BIN_TOP); }
    ctx.textAlign = 'center';
    ctx.fillStyle = on ? '#ffd200' : 'rgba(255,255,255,0.3)';
    ctx.font = '800 34px system-ui, sans-serif';
    ctx.fillText(String(weights[BIN_BIT[i]]), x + BIN_W / 2, BIN_TOP + 48);
    ctx.font = '700 16px "Courier New", monospace';
    ctx.fillText(on ? '1' : '0', x + BIN_W / 2, BIN_TOP + 74);
  }

  // pegs and dividers
  ctx.strokeStyle = 'rgba(255,255,255,0.55)'; ctx.fillStyle = 'rgba(255,255,255,0.55)';
  ctx.lineCap = 'round';
  for (const c of caps) {
    ctx.lineWidth = c.r * 2;
    ctx.beginPath(); ctx.moveTo(c.ax, c.ay); ctx.lineTo(c.bx, c.by); ctx.stroke();
    if (c.ax === c.bx && c.ay === c.by) { ctx.beginPath(); ctx.arc(c.ax, c.ay, c.r, 0, Math.PI * 2); ctx.fill(); }
  }
  ctx.fillStyle = 'rgba(255,255,255,0.25)';
  ctx.fillRect(0, FLOOR_Y, W, 10);

  // dropper + aim line + ball
  if (!ball && !settled && !challengeDone) {
    ctx.setLineDash([4, 8]); ctx.strokeStyle = 'rgba(255,210,0,0.35)'; ctx.lineWidth = 2; ctx.lineCap = 'butt';
    ctx.beginPath(); ctx.moveTo(aimX, 40 + BALL_R); ctx.lineTo(aimX, BIN_TOP); ctx.stroke();
    ctx.setLineDash([]);
    drawBall(aimX, 40 + Math.sin(time * 3) * 2, 0);
  }
  if (ball) { ballSpin += ball.spin * 0.05; drawBall(ball.x, ball.y, ballSpin); }
  if (settled) {
    ctx.strokeStyle = 'rgba(255,210,0,' + (1 - settled.t / 0.7) + ')'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(settled.x, settled.y, BALL_R + settled.t * 60, 0, Math.PI * 2); ctx.stroke();
  }
}
requestAnimationFrame(frame);
</script>
